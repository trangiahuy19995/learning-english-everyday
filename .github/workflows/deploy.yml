name: Build Web Demo and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. BUILD WEB ASSETS
  # ==========================================
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ==========================================
  # 2. DEPLOY TO GITHUB PAGES (ONLINE DEMO)
  # ==========================================
  deploy-web:
    name: Deploy to GitHub Pages (Online Demo)
    runs-on: ubuntu-latest
    needs: build-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # 3. BUILD ANDROID APK
  # ==========================================
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web & Sync Capacitor Android
        run: npm run cap:build

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk ./learning-english-everyday.apk
          ls -lh ./learning-english-everyday.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-english-everyday-apk
          path: ./learning-english-everyday.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Learning English Everyday v1.0.0 (Android APK)"
          body: |
            ## 📱 Learning English Everyday — Học Tiếng Anh Mỗi Ngày
            
            - 🌐 **Web Online Demo:** https://trangiahuy19995.github.io/learning-english-everyday/
            - 📦 **File APK:** `learning-english-everyday.apk`
            - 🚀 **Phiên bản:** v1.0.0 (Android Debug APK)
            
            ### Hướng dẫn cài đặt trên Android:
            1. Tải file `learning-english-everyday.apk` đính kèm ở mục **Assets** bên dưới.
            2. Mở file `.apk` trên điện thoại Android và chọn **Cài đặt** (Cho phép cài đặt từ nguồn không xác định nếu được hỏi).
            3. Trải nghiệm học collocation, idiom, bài tập trắc nghiệm và SRS ngắt quãng!
          files: ./learning-english-everyday.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
